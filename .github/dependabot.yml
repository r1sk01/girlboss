version: 2
updates:
    - package-ecosystem: 'npm'
      directory: '/'
      schedule:
          interval: 'weekly'
      open-pull-requests-limit: 5
      groups:
          bot-dependencies:
              patterns:
                  - '*'
              update-types:
                  - 'minor'
                  - 'patch'

    - package-ecosystem: 'npm'
      directory: '/web'
      schedule:
          interval: 'weekly'
      open-pull-requests-limit: 5
      groups:
          web-dependencies:
              patterns:
                  - '*'
              update-types:
                  - 'minor'
                  - 'patch'

    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'weekly'

    - package-ecosystem: 'docker'
      directories:
          - '/docker'
      schedule:
          interval: 'weekly'
